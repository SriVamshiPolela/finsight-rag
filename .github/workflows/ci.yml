name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          # CPU-only torch first: the default PyPI wheel pulls ~1.5GB of
          # unused NVIDIA CUDA libraries, same fix as the Docker images.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check src/ scripts/ tests/

      - name: Test (pytest)
        run: pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # data/processed/chunks.jsonl and data/indexes/e5-small/ are gitignored
      # (regeneratable build output - see README's Phase 1 storage tradeoff),
      # so a fresh checkout doesn't have them, but the Dockerfile COPYs them
      # in. Placeholder files here only satisfy those COPY steps so this job
      # can validate the image *builds* (dependencies install, syntax is
      # correct) on every push - it is not asserting the resulting image is
      # runnable with real data. That was verified manually against real
      # data in Phase 5 (built, deployed to AWS, confirmed live).
      - name: Create placeholder data files for the build-only smoke test
        run: |
          mkdir -p data/processed data/indexes/e5-small
          echo '[]' > data/processed/chunks.jsonl
          echo '[]' > data/processed/manifest.json
          touch data/indexes/e5-small/index.faiss data/indexes/e5-small/meta.jsonl

      - name: Build the API image (no push - proves the build succeeds, not that it's runnable)
        run: docker build -t finsight-rag-api:ci .
