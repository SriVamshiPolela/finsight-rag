[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Explicit rather than relying on ruff's version-dependent default selection -
# CI hit a real RUF100 mismatch against local runs because of this before
# this file existed. E4/E7/E9/F are ruff's own documented default families;
# stating them here makes behavior deterministic across ruff versions.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
